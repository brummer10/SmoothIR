name: build-source

on:
  push:

jobs:

  source:
    runs-on: ubuntu-22.04
    permissions:
        contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: distrho/dpf-makefile-action@v1
        with:
          target: source


  linux-clap:
    strategy:
      matrix:
        target: [linux-x86_64]
    runs-on: ubuntu-22.04
    permissions:
        contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: distrho/dpf-makefile-action@v1
        with:
          target: ${{ matrix.target }}
          suffix: -clap
          extraargs: clap
          lto: false
          pawpaw: true
